services:
  api-forge:
    build: .
    env_file:
      - .env
    volumes:
      - forge-data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - api-forge

volumes:
  forge-data:
  caddy-data:
  caddy-config: